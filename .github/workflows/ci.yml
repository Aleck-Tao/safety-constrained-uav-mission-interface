name: contract-and-policy

on:
  push:
  pull_request:

jobs:
  test-and-reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Reproduce example batch
        run: mission-interface batch examples/mission_commands.txt --out results/batch_report.json
      - name: Verify deterministic result
        run: git diff --exit-code -- results/batch_report.json
